function lerp(a,b,t){return a+(b-a)*t;}
function ease(t){t=clamp(t,0,1);return t*t*(3-2*t);}
function easeOutBack(t){t=clamp(t,0,1);var c=1.45,u=t-1;return 1+c*u*u*u+(c-1)*u*u;}

/* ---------- canvas ---------- */
var cv=document.getElementById('c');
var ctx=cv.getContext('2d');
var SCALE=1,DPR=1;
function viewportSize(){
 var v=window.visualViewport;
 return {w:v?v.width:window.innerWidth,h:v?v.height:window.innerHeight};
}
function resize(){
  var vp=viewportSize(),rw=vp.w||W,rh=vp.h||H;
  var touchCap=('ontouchstart' in window)||(navigator.maxTouchPoints>0);
  var raw=window.devicePixelRatio||1;
  DPR=Math.min(raw,touchCap?1.65:2);
  var s=Math.min(rw/W,rh/H); SCALE=s;
  cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px';
  cv.width=Math.max(1,Math.round(W*s*DPR));cv.height=Math.max(1,Math.round(H*s*DPR));
  ctx.setTransform(s*DPR,0,0,s*DPR,0,0);ctx.imageSmoothingEnabled=true;
}
try{window.addEventListener('resize',resize,{passive:true});window.addEventListener('orientationchange',resize,{passive:true});if(window.visualViewport)window.visualViewport.addEventListener('resize',resize,{passive:true});}catch(e){}

/* ============================================================
   ASSETS - every graphic is a raster image (asset pack v1)
   Files are 2x game size; img()/imgC() draw them at half size.
   ============================================================ */
var ASSET_BASE='../assets/';
var ASSET_MANIFEST=/*@@MANIFEST@@*/null;
var ASSET_DATA=/*@@DATA@@*/null;
var IMG={},FR={},ASSETS={total:0,done:0,ready:false};
function assetURL(rel){return (ASSET_DATA&&ASSET_DATA[rel])||(ASSET_BASE+rel);}
function loadImg(rel){
 ASSETS.total++;var im=new Image();
 im.onload=im.onerror=function(){ASSETS.done++;if(ASSETS.done>=ASSETS.total)ASSETS.ready=true;};
 im.src=assetURL(rel);return im;
}
function loadAssets(man){
 var k,id,n,d;
 for(k in man.images)IMG[k]=loadImg(man.images[k]);
 for(id in man.fighters){FR[id]={};for(n in man.fighters[id]){d=man.fighters[id][n];FR[id][n]={im:loadImg(d.src),ox:d.ox/2,oy:d.oy/2,w:d.w/2,h:d.h/2};}}
 if(!ASSETS.total)ASSETS.ready=true;
 try{var ri=document.getElementById('rotimg');if(ri&&man.images['icons/icon_rotate_phone'])ri.src=assetURL(man.images['icons/icon_rotate_phone']);}catch(e){}
}
if(ASSET_MANIFEST)loadAssets(ASSET_MANIFEST);
else{try{fetch(ASSET_BASE+'manifest.json').then(function(r){return r.json();}).then(loadAssets)['catch'](function(){ASSETS.ready=true;});}catch(e){ASSETS.ready=true;}}
function I(k){var im=IMG[k];return (im&&im.complete&&im.naturalWidth)?im:null;}
/* top-left placement; default size = half the file size */
function img(k,x,y,w,h){var im=I(k);if(!im)return false;ctx.drawImage(im,x,y,w===undefined?im.naturalWidth/2:w,h===undefined?im.naturalHeight/2:h);return true;}
/* centred placement, sc = extra scale, optional rotation */
function imgC(k,cx,cy,sc,rot){
 var im=I(k);if(!im)return false;var w=im.naturalWidth/2*(sc||1),h=im.naturalHeight/2*(sc||1);
 if(rot){ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);ctx.drawImage(im,-w/2,-h/2,w,h);ctx.restore();}
 else ctx.drawImage(im,cx-w/2,cy-h/2,w,h);
 return true;
}
/* 9-slice; insets t,r,b,l are file pixels, drawn at half size */
function nine(k,x,y,w,h,t,r,b,l){
 var im=I(k);if(!im)return false;var iw=im.naturalWidth,ih=im.naturalHeight;
 var sx=[0,l,iw-r,iw],sy=[0,t,ih-b,ih],dx=[x,x+l/2,x+w-r/2,x+w],dy=[y,y+t/2,y+h-b/2,y+h];
 for(var j=0;j<3;j++)for(var i=0;i<3;i++){
  var sw=sx[i+1]-sx[i],sh=sy[j+1]-sy[j],dw=dx[i+1]-dx[i],dh=dy[j+1]-dy[j];
  if(sw>0&&sh>0&&dw>0&&dh>0)ctx.drawImage(im,sx[i],sy[j],sw,sh,dx[i],dy[j],dw,dh);
 }
 return true;
}

/* ============================================================
   AUDIO
   ============================================================ */
var A={
 ctx:null,master:null,on:(LS.get('jdkf_snd','1')==='1'),ready:false,
 init:function(){
  if(this.ready)return;
  var AC=null;
  try{AC=window.AudioContext||window.webkitAudioContext;}catch(e){AC=null;}
  if(!AC)return;
  try{
   this.ctx=new AC();
   this.master=this.ctx.createGain();
   this.master.gain.value=this.on?0.5:0;
   this.master.connect(this.ctx.destination);
   this.ready=true;
  }catch(e){this.ctx=null;}
 },
 toggle:function(){this.on=!this.on;LS.set('jdkf_snd',this.on?'1':'0');
   if(this.master)this.master.gain.value=this.on?0.5:0;},
 tone:function(f,dur,type,vol,slide){
  if(!this.ready||!this.on)return;
  try{
   var c=this.ctx,o=c.createOscillator(),g=c.createGain();
   o.type=type||'square';o.frequency.setValueAtTime(f,c.currentTime);
   if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),c.currentTime+dur);
   g.gain.setValueAtTime(0.0001,c.currentTime);
   g.gain.exponentialRampToValueAtTime(vol||0.2,c.currentTime+0.008);
   g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+dur);
   o.connect(g);g.connect(this.master);o.start();o.stop(c.currentTime+dur+0.02);
  }catch(e){}
 },
 noise:function(dur,vol,lp){
  if(!this.ready||!this.on)return;
  try{
   var c=this.ctx,n=Math.floor(c.sampleRate*dur),b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);
   for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
   var s=c.createBufferSource();s.buffer=b;
   var f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=lp||1800;
   var g=c.createGain();g.gain.value=vol||0.2;
   s.connect(f);f.connect(g);g.connect(this.master);s.start();
  }catch(e){}
 },
 whoosh:function(){this.noise(0.13,0.13,900);},
 hit:function(){this.noise(0.09,0.35,600);this.tone(150,0.09,'square',0.22,60);},
 block:function(){this.noise(0.07,0.2,3000);this.tone(420,0.06,'square',0.12);},
 jump:function(){this.tone(300,0.11,'square',0.14,620);},
 ko:function(){this.tone(220,0.5,'sawtooth',0.25,60);this.noise(0.45,0.3,700);},
 coin:function(){this.tone(880,0.07,'square',0.16);var s=this;setTimeout(function(){s.tone(1320,0.1,'square',0.16);},70);},
 gong:function(){this.tone(160,0.9,'triangle',0.3,80);this.noise(0.7,0.15,2200);},
 throwS:function(){this.tone(700,0.1,'triangle',0.12,240);},
 parry:function(){this.tone(1180,0.055,'square',0.18,760);this.tone(620,0.12,'triangle',0.12,920);this.noise(0.05,0.12,5200);},
 rage:function(){this.tone(92,0.32,'sawtooth',0.22,58);this.noise(0.24,0.16,900);}
};

/* --- music: hidžaz motiv --- */
var MUS={
 t:0,step:0,bpm:126,baseBpm:126,playing:false,next:0,stage:0,rage:false,
 scale:[0,1,4,5,7,8,11],
 mel:[0,2,3,2,4,3,2,0, 0,2,3,4,5,4,3,2, 3,4,5,4,3,2,1,0, 0,-3,0,2,3,2,0,0],
 start:function(){this.playing=true;this.next=0;this.step=0;},
 setStage:function(idx,rage){this.stage=idx||0;this.rage=!!rage;var bp=[126,122,118,116,128,132,136][this.stage]||126;this.bpm=bp+(this.rage?18:0);this.next=0;},
 stop:function(){this.playing=false;},
 update:function(){
  if(!this.playing||!A.ready||!A.on)return;
  var c=A.ctx,spb=60/this.bpm/2;
  if(this.next===0)this.next=c.currentTime+0.05;
  while(this.next<c.currentTime+0.25){
   var s=this.step%32;
   var deg=this.mel[s];
   if(deg!==null&&deg!==undefined){
    var oct=Math.floor(deg/7),d=((deg%7)+7)%7;
    var semi=this.scale[d]+12*oct;
    var f=146.83*Math.pow(2,semi/12);
    this.blip(f,spb*0.9,(this.stage===3?'triangle':(this.stage===5?'sawtooth':'square')),this.rage?0.072:0.055);
   }
   if(s%4===0)this.blip(73.4,spb*1.4,'triangle',this.rage?0.13:(this.stage===4?0.065:0.09));
   if(s%4===2)this.blip(110,spb*0.8,'triangle',0.06);
   if(s%2===1)this.hat(0.03);
   this.next+=spb;this.step++;
  }
 },
 blip:function(f,dur,type,vol){
  try{
   var c=A.ctx,o=c.createOscillator(),g=c.createGain();
   o.type=type;o.frequency.value=f;
   g.gain.setValueAtTime(0.0001,this.next);
   g.gain.exponentialRampToValueAtTime(vol,this.next+0.01);
   g.gain.exponentialRampToValueAtTime(0.0001,this.next+dur);
   o.connect(g);g.connect(A.master);o.start(this.next);o.stop(this.next+dur+0.02);
  }catch(e){}
 },
 hat:function(v){
  try{
   var c=A.ctx,n=Math.floor(c.sampleRate*0.03),b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);
   for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
   var s=c.createBufferSource();s.buffer=b;
   var f=c.createBiquadFilter();f.type='highpass';f.frequency.value=6000;
   var g=c.createGain();g.gain.value=v;
   s.connect(f);f.connect(g);g.connect(A.master);s.start(this.next);
  }catch(e){}
 }
};

var K={left:false,right:false,up:false,down:false,punch:false,kick:false,any:false};
var KP={punch:false,kick:false,up:false,start:false};
var TOUCH=false;
var keymap={
 'ArrowLeft':'left','KeyA':'left','ArrowRight':'right','KeyD':'right',
 'ArrowUp':'up','KeyW':'up','ArrowDown':'down','KeyS':'down',
 'KeyJ':'punch','KeyZ':'punch','KeyN':'punch',
 'KeyK':'kick','KeyX':'kick','KeyM2':'kick','Comma':'kick'
};
try{
window.addEventListener('keydown',function(e){
 A.init();
 var c=e.code;
 if(c==='Space'||c==='Enter'){KP.start=true;K.any=true;e.preventDefault();}
 if(c==='KeyM'){A.toggle();return;}
 if(c==='KeyL'){cycleLang();return;}
 var m=keymap[c];
 if(m){ if(!K[m]){ if(m==='punch')KP.punch=true; if(m==='kick')KP.kick=true; if(m==='up')KP.up=true;}
        K[m]=true;e.preventDefault();}
 K.any=true;
});
window.addEventListener('keyup',function(e){
 var m=keymap[e.code];if(m)K[m]=false;
 if(e.code==='Space'||e.code==='Enter')K.any=false;
});
}catch(e){}

/* touch: virtual 8-way stick + two arcade buttons */
var activeTouch={},JOY={id:null,cx:190,cy:545,x:190,y:545,r:105,dead:24},BTN={
 punch:{x:1008,y:565,r:66,lab:'RUKA'}, kick:{x:1160,y:480,r:72,lab:'NOGA'}
};
syncLangUI();
function toGame(cx,cy){var r=cv.getBoundingClientRect();return {x:(cx-r.left)/(r.width/W),y:(cy-r.top)/(r.height/H)};}
function setDir(dx,dy){
 var d=Math.hypot(dx,dy),nx=d?dx/d:0,ny=d?dy/d:0;
 K.left=d>JOY.dead&&nx<-.32;K.right=d>JOY.dead&&nx>.32;
 K.up=d>JOY.dead&&ny<-.44;K.down=d>JOY.dead&&ny>.44;
 if(K.up&&!activeTouch._upHeld){KP.up=true;activeTouch._upHeld=true;}
 if(!K.up)activeTouch._upHeld=false;
}
function buttonAt(g){for(var k in BTN){var b=BTN[k],dx=g.x-b.x,dy=g.y-b.y;if(dx*dx+dy*dy<=b.r*b.r)return k;}return null;}
function pressButton(id){if(!id)return; if(!K[id]){if(id==='punch')KP.punch=true;if(id==='kick')KP.kick=true;} K[id]=true;}
function releaseTouchBinding(id){var b=activeTouch[id];if(!b)return;if(b==='joy'){JOY.id=null;setDir(0,0);}else K[b]=false;delete activeTouch[id];}
function touchStart(e){
 TOUCH=true;A.init();K.any=true;var chip=false;
 for(var i=0;i<e.changedTouches.length;i++){
  var tp=e.changedTouches[i],g=toGame(tp.clientX,tp.clientY),b=buttonAt(g);
  if(titleChipAt(g)){chip=true;continue;}
  if(b){activeTouch[tp.identifier]=b;pressButton(b);continue;}
  if(g.x<W*0.48&&JOY.id===null){JOY.id=tp.identifier;activeTouch[tp.identifier]='joy';JOY.cx=clamp(g.x,115,285);JOY.cy=clamp(g.y,430,615);JOY.x=g.x;JOY.y=g.y;setDir(g.x-JOY.cx,g.y-JOY.cy);}
 }
 if(S.scene!=='fight'&&!chip)KP.start=true;e.preventDefault();
}
function touchMove(e){
 for(var i=0;i<e.changedTouches.length;i++){
  var tp=e.changedTouches[i],g=toGame(tp.clientX,tp.clientY),old=activeTouch[tp.identifier];
  if(old==='joy'){JOY.x=g.x;JOY.y=g.y;setDir(g.x-JOY.cx,g.y-JOY.cy);continue;}
  var b=buttonAt(g);
  if(old!==b){if(old&&old!=='joy')K[old]=false;if(b){activeTouch[tp.identifier]=b;pressButton(b);}else delete activeTouch[tp.identifier];}
 }
 e.preventDefault();
}
function touchEnd(e){for(var i=0;i<e.changedTouches.length;i++)releaseTouchBinding(e.changedTouches[i].identifier);K.any=Object.keys(activeTouch).some(function(k){return k!=='_upHeld';});e.preventDefault();}
try{
 cv.addEventListener('touchstart',touchStart,{passive:false});cv.addEventListener('touchend',touchEnd,{passive:false});cv.addEventListener('touchcancel',touchEnd,{passive:false});cv.addEventListener('touchmove',touchMove,{passive:false});
 cv.addEventListener('mousedown',function(e){A.init();if(titleChipAt(toGame(e.clientX,e.clientY)))return;KP.start=true;});
}catch(e){}

var SEG={torso:70,neck:32,upper:34,fore:32,thigh:46,shin:48,head:21};
var P={
 idle     :{hip:[0,0], lean:6,  head:-5, af:[44,152], ab:[24,142], lf:[26,-6],  lb:[-28,6]},
 crouch   :{hip:[0,42], lean:20, head:-10,af:[58,132], ab:[34,118], lf:[64,-58], lb:[-60,66]},

 if(f.sprOverride)return [f.sprOverride];
 if(f.state==='ko')return f.deadT<260?['down','hurt']:['ko'];
 if(f.state==='down')return f.t<120?['hurt']:(f.t<880?['down']:['crouch']);
 if(f.state==='hurt')return ['hurt'];
 if(f.state==='win')return ['win'];
 if(f.state==='sit')return ['sit','crouch'];
 if(f.state==='attack'&&f.move)return attackFrameNames(f);
 if(!f.onGround){var vy=f.vy||0;return vy<-4?['jump_rise','jump']:(vy<3?['jump_apex','jump']:['jump_fall','jump']);}
 if(f.blocking)return ['block'];
 if(f.crouching)return ['crouch'];
 if(f.state==='swing'){var c=Math.PI*2,sp=(((f.spin||0)%c)+c)%c;return ['swing_'+(1+Math.floor(sp/(c/3))%3),'idle'];}
 if(f.landT>70)return ['land','crouch'];
 if(f.state==='walk'){var w=walkIndex(f)+1;return (Math.abs(f.vx)>2.8&&hasFrame(id,'run_1'))?['run_'+w]:['walk_'+w];}
 if(id==='zumbul'&&f.mode==='rest')return ['chain_rest','idle'];
 if(id==='mrkonja'&&f.phase2)return ['rage','idle'];
 return Math.floor((f.t||0)/520)%2?['idle_2','idle']:['idle'];
}

 if(comp)ctx.globalCompositeOperation=comp;

 ctx.drawImage(fr.im,fr.ox,fr.oy,fr.w,fr.h);
 ctx.restore();
}
function drawChainBall(f){
 if(fid(f)!=='zumbul'||!f.ball||!f.pts)return;
 if(f.state==='ko'&&f.deadT>120)return;
 var p=f.pts,s=f.scale,ax=f.swinging?p.sh.x:p.handF.x,ay=f.swinging?p.sh.y-6*s:p.handF.y;
 var bx=f.ball.x,by=f.ball.y,L=Math.hypot(bx-ax,by-ay),n=Math.max(2,Math.floor(L/(9*s))),ang=Math.atan2(by-ay,bx-ax);

 if(link){for(var i=1;i<n;i++){var t=i/n;ctx.save();ctx.translate(lerp(ax,bx,t),lerp(ay,by,t));ctx.rotate(ang);ctx.drawImage(link,-6*s,-4*s,12*s,8*s);ctx.restore();}}
 imgC('props/chain_ball',bx,by,s*0.9);
}

function startMove(f,key){
 var m=MOVES[key];if(!m)return false;
 f.state='attack';f.t=0;f.move=m;f.moveKey=key;f.hitDone=false;f.lastAttackPoint=null;
 if(m.sfx==='p'||m.sfx==='k')A.whoosh();
 else if(m.sfx==='w')A.whoosh();

}
function resolvePose(f){
 if(f.state==='ko'||f.state==='down')return cutscenePose(f,'lose',f.t,P.hurt);
 if(f.state==='hurt')return hurtReactPose(f);
 if(f.state==='sit')return P.sit;
 if(f.state==='win')return cutscenePose(f,'win',f.t,P.win);
 if(f.state==='attack')return moveKeyframePose(f,f.move);
 if(!f.onGround)return dynamicJumpPose(f);
 if(f.blocking)return landingPose(f,P.block);
 if(f.crouching)return landingPose(f,P.crouch);
 if(f.state==='swing')return P.swing;
 if(f.state==='walk'){
  var sp=Math.abs(f.vx), step=sp>2.8?runPose(f.walkPh,f.vx*f.dir<0,sp):walkPose(f.walkPh,f.vx*f.dir<0,sp);
  return landingPose(f,step);

}
function fighterPhysics(f,dt){
 f.x+=f.vx*dt/16.67;
 if(!f.onGround){
  f.vy+=0.62*dt/16.67;
  f.y+=f.vy*dt/16.67;
  if(f.y>=GROUND){var iv=Math.abs(f.vy);f.y=GROUND;f.vy=0;f.onGround=true;
   f.landT=Math.max(f.landT||0,clamp(70+iv*16,80,180));
   if(iv>3.2)spark(f.x,GROUND-10,Math.round(5+iv*1.2),'#e4c993');
   if(f.state==='attack'&&f.move&&f.move.air){f.state='idle';f.move=null;}
   f.vx*=0.2;}
 }else{
  f.vx*=Math.pow(0.75,dt/16.67);
  if(Math.abs(f.vx)<0.05)f.vx=0;
 }
 f.x=clamp(f.x,70,W-70);
}
function updateFighter(f,dt){
 f.t+=dt;
 if(f.flash>0)f.flash-=dt;
 if(f.landT>0)f.landT-=dt;
 if(f.parryT>0)f.parryT-=dt;
 if(f.invuln>0)f.invuln-=dt;
 f.blinkT-=dt;
 if(f.blinkT<=0){f.blink=110;f.blinkT=rnd(1800,5200);}
 if(f.blink>0)f.blink-=dt;
 if(f.state==='attack'&&f.t>f.move.st+f.move.ac+f.move.rc){
  if(!f.move.air||f.onGround){f.state='idle';f.move=null;}
 }
 if(f.state==='hurt'&&f.t>f.stun){f.state='idle';}
 if(f.state==='down'){
  var downT=koFallTarget(f)*0.86;

 }
 if(f.state==='ko'){var koT=koFallTarget(f);f.fall=Math.min(koT,f.fall+dt*(0.24+koT*0.0011));f.deadT+=dt;}
 fighterPhysics(f,dt);
 if(f.weapon==='nuncake')f.nunPhase+=dt*0.012;

function updParts(dt){
 for(var i=parts.length-1;i>=0;i--){
  var p=parts[i];p.t+=dt;
  if(p.t>=p.life){freePartAt(i);continue;}
  p.x+=p.vx*dt/16.67;p.y+=p.vy*dt/16.67;

var ONOM=['BUM!','TRES!','PLJAS!','LUP!','ŠLJAK!','BUS!'];
function applyHit(att,def,m,pt){
 var blocked=def.blocking&&def.onGround&&def.state!=='attack'&&
   ((def.dir>0&&att.x>def.x)||(def.dir<0&&att.x<def.x));
 if(m.h==='low'&&def.crouching)blocked=blocked&&true;
 if(def.invuln>0)return;
 var dmg=m.dmg;
 def.hitDir=att.dir;
 var counter=!blocked&&def.state==='attack'&&def.move&&def.t<def.move.st;
 var parried=blocked&&def.isPlayer&&def.parryT>0;
 if(parried){
  def.parryT=0;def.hp=Math.max(1,def.hp);att.vx=-att.dir*4.2;att.state='hurt';att.t=0;att.stun=CONFIG.PARRY_STUN;att.flash=90;
  A.parry();impactBurst(pt.x,pt.y,1.3,'#d8f3ff');S.hitStop=CONFIG.PARRY_FREEZE;S.shake=4;S.impactT=135;S.parryT=760;addScore(450);showMsg(t('parry'));return;
 }
 if(counter){dmg=Math.round(dmg*1.35);S.counterT=760;S.impactT=150;}
 if(blocked){
  dmg=Math.max(1,Math.round(dmg*0.2));
  def.hp-=dmg;
  def.vx=(att.dir)*3.2;
  A.block();impactBurst(pt.x,pt.y,0.7,'#bfe4ff');
  S.hitStop=Math.max(S.hitStop,28);S.shake=Math.max(S.shake,3);
 }else{
  var pow=1+(dmg*0.06)+((m.kb||5)*0.05)+(counter?0.35:0)+(m.knock?0.28:0)+(m.sfx==='w'?0.22:0);
  def.hp-=dmg;
  def.vx=(att.dir)*(m.kb||5)*1.08;
  def.flash=170;
  A.hit();
  impactBurst(pt.x,pt.y,pow,att.isPlayer?'#ffd36b':'#ff9a7a');if(att.weapon==='motka')spark(pt.x,pt.y,7,'#b67a42');else if(att.weapon==='handzar')spark(pt.x,pt.y,6,'#dce8ef');else if(att.weapon==='nuncake')spark(pt.x,pt.y,5,'#d8cdb5');
  boom(pt.x,pt.y-24,ONOM[ri(0,ONOM.length-1)],att.isPlayer?'#ffe08a':'#ff9a7a');
  S.hitStop=att.isPlayer?Math.round(72+pow*16):Math.round(54+pow*10);
  S.shake=att.isPlayer?Math.round(7+pow*2):Math.round(5+pow*1.5);S.impactT=110+pow*14;
  if(m.knock&&def.onGround){def.state='down';def.t=0;def.fall=0;}
  else{def.state='hurt';def.t=0;def.stun=m.air?340:280;}
  if(!def.onGround){def.vy=-3.6-((m.kb||5)*0.08);}
 }
 if(att.isPlayer){addScore(blocked?20:Math.round(dmg*12));if(!blocked){S.combo=(S.comboT>0?S.combo+1:1);S.comboT=850;if(S.combo>1)addScore(S.combo*20);}}
 if(def.hp<=0){
  def.hp=0;def.state='ko';def.t=0;def.fall=0;def.dead=true;def.deadT=0;
  A.ko();
  boom(def.pts.sh.x,def.pts.sh.y-40,'K.O.!',att.isPlayer?'#ffd54a':'#ff6b5a');
  impactBurst(def.pts.sh.x,def.pts.sh.y-10,2.2,att.isPlayer?'#ffd54a':'#ff6b5a');
  S.shake=CONFIG.KO_SHAKE;S.hitStop=CONFIG.KO_HITSTOP;S.koSlowT=720;
  if(att.isPlayer){addScore(1200+S.stage*400+S.loop*800);S.scene='clear';S.sceneT=0;S.tally=0;S.tallyStep=0;player.state='win';player.t=0;}
  else{S.scene='ko';S.sceneT=0;}
 }
}
function checkHits(att,def){
 if(att.state!=='attack'||!att.move||att.hitDone)return;
 var m=att.move;
 if(att.t<m.st||att.t>m.st+m.ac)return;
 if(m.proj)return;
 if(def.state==='ko')return;
 var ap=attackPoint(att),prev=att.lastAttackPoint||ap,r=(m.r||24)*att.scale;
 att.lastAttackPoint={x:ap.x,y:ap.y};
 var cs=hurtCircles(def);
 for(var i=0;i<cs.length;i++){
  var cx=cs[i][0],cy=cs[i][1],vx=ap.x-prev.x,vy=ap.y-prev.y,l2=vx*vx+vy*vy||1;
  var u=clamp(((cx-prev.x)*vx+(cy-prev.y)*vy)/l2,0,1),qx=prev.x+vx*u,qy=prev.y+vy*u;
  var dx=qx-cx,dy=qy-cy,rr=r+cs[i][2];
  if(dx*dx+dy*dy<rr*rr){att.hitDone=true;applyHit(att,def,m,ap);return;}
 }
 /* projektile abwehren */
 for(var j=projs.length-1;j>=0;j--){
  var q=projs[j],dx2=ap.x-q.x,dy2=ap.y-q.y;
  if(dx2*dx2+dy2*dy2<(r+18)*(r+18)){
   freeProjAt(j);spark(q.x,q.y,10,'#c58ad4');A.block();
   if(att.isPlayer)addScore(150);
  }
 }
}

function playerControl(dt){
 var f=player;
 if(f.bufPunch>0)f.bufPunch-=dt;if(f.bufKick>0)f.bufKick-=dt;
 if(KP.punch){f.bufPunch=CONFIG.INPUT_BUFFER;KP.punch=false;}if(KP.kick){f.bufKick=CONFIG.INPUT_BUFFER;KP.kick=false;}
 if(f.state==='ko'||f.state==='hurt'||f.state==='down'||f.state==='win')return;
 f.dir=(foe&&foe.x<f.x)?-1:1;
 var busy=(f.state==='attack'),away=(f.dir>0)?K.left:K.right;
 f.crouching=K.down&&f.onGround&&!busy;f.blocking=away&&f.onGround&&!busy;if(f.blocking&&!f.wasBlocking)f.parryT=CONFIG.PARRY_MS;f.wasBlocking=f.blocking;
 if(!busy&&f.onGround){
  var sp=3.9;if(K.left&&!K.down){f.vx=-sp;f.state='walk';}else if(K.right&&!K.down){f.vx=sp;f.state='walk';}else{f.vx*=0.56;if(f.state==='walk')f.state='idle';}
  if(f.state==='walk')f.walkPh+=dt*.0125*(0.7+Math.abs(f.vx)/sp*0.9);
  if(KP.up&&!K.down){f.onGround=false;f.vy=-13.4;f.state='jump';A.jump();f.vx=(K.left?-4.6:(K.right?4.6:0));}
 }
 KP.up=false;
 busy=(f.state==='attack');
 /* 130 ms input buffer: attack fires as soon as recovery ends */
 if(!busy&&f.bufPunch>0){f.bufPunch=0;if(!f.onGround)startMove(f,'jumpKick');else if(K.down)startMove(f,'punchLow');else if(K.up)startMove(f,'punchHigh');else startMove(f,'punchMid');}
 busy=(f.state==='attack');
 if(!busy&&f.bufKick>0){f.bufKick=0;if(!f.onGround)startMove(f,'jumpKick');else if(K.down)startMove(f,'sweep');else if(K.up)startMove(f,'kickHigh');else startMove(f,'kickMid');}
}

/* ============================================================
   KI: JEDER GEGNER EIN EIGENES MUSTER
   ============================================================ */
function aiUpdate(e,p,dt){
 if(e.state==='ko'||e.state==='hurt'||e.state==='down')return;
 e.dir=(p.x<e.x)?-1:1;
 e.cd-=dt;e.modeT-=dt;
 var d=Math.abs(p.x-e.x);
 var busy=(e.state==='attack');
 var sp=e.speed;
 var lvl=S.loop;
 e.crouching=false;e.blocking=false;
 e.swinging=false;
 function walk(dirSign,mul){
  e.vx=dirSign*sp*1.6*(mul||1);
  e.state='walk';e.walkPh+=dt*0.0115;
 }
 function stand(){e.vx*=0.7;if(e.state==='walk')e.state='idle';}

 switch(e.cfg.ai){

 /* ---- LEVAT: spor, dugo pauzira, ponekad sjedne ---- */
 case 'lazy':
  if(e.state==='sit'){
   if(e.t>1400){e.state='idle';e.cd=300;}
   e.vx*=0.6;return;
  }
  if(busy)return;
  if(d>170)walk(e.dir,0.8);
  else{
   stand();
   if(e.cd<=0){
    var r=Math.random();
    if(r<0.2){e.state='sit';e.t=0;e.cd=1600;}
    else if(r<0.72)startMove(e,'slowPunch');
    else startMove(e,'slowKick');
    e.cd=rnd(700,1250)-lvl*120;
   }
  }
  break;

 /* ---- BAJO: baca sljive sa distance, bjezi kad prides ---- */
 case 'thrower':
  if(busy){
   if(e.move.proj&&e.t>=e.move.st&&!e.hitDone){e.hitDone=true;spawnProj(e,e.throwH);}
   return;
  }
  if(d<260){walk(-e.dir,1.25);
   if(e.cd<=0&&d<150){startMove(e,'slowPunch');e.cd=rnd(600,900);}
  }else if(d>620)walk(e.dir,1.0);
  else{
   stand();
   if(e.cd<=0){
    var hs=['high','mid','low'];
    e.throwH=hs[ri(0,2)];
    startMove(e,'toss');
    e.cd=rnd(680,1150)-lvl*140;
   }
  }
  break;

 /* ---- MUJO: duga motka, udara sa distance pa odskoci ---- */
 case 'pole':
  if(busy)return;
  if(e.mode==='hop'){
   if(e.modeT<=0){e.mode='';}
   else{walk(-e.dir,1.3);break;}
  }
  if(d>330)walk(e.dir,1.0);
  else if(d<170)walk(-e.dir,1.1);
  else{
   stand();
   if(e.cd<=0){
    var r2=Math.random();
    if(r2<0.4)startMove(e,'poleMid');
    else if(r2<0.72)startMove(e,'poleHigh');
    else startMove(e,'poleLow');
    e.cd=rnd(820,1300)-lvl*150;
    e.mode='hop';e.modeT=rnd(320,520);
   }
  }
  break;

 /* ---- ZUMBUL: vrti kuglu, visina se mijenja, sporo napreduje ---- */
 case 'chain':
  if(busy)return;
  if(e.mode===''){e.mode='swing';e.modeT=rnd(2600,4200);}
  if(e.mode==='swing'){
   e.swinging=true;e.state='swing';
   e.spin+=dt*0.0052*(1+lvl*0.16);
   var R=132*e.scale;
   var cxp=e.pts.sh.x,cyp=e.pts.sh.y-6;
   e.ball.x=cxp+Math.cos(e.spin)*R*e.dir;
   e.ball.y=cyp+Math.sin(e.spin)*R*0.86;
   if(d>110)e.vx=e.dir*sp*0.85;else e.vx*=0.6;
   if(e.modeT<=0){e.mode='rest';e.modeT=rnd(700,1100);}
   /* pogodak kuglom */
   if(p.state!=='ko'&&p.invuln<=0&&e.ballCd<=0){
    var cs=hurtCircles(p);
    for(var i=0;i<cs.length;i++){
     var dx=e.ball.x-cs[i][0],dy=e.ball.y-cs[i][1],rr=18*e.scale+cs[i][2];
     if(dx*dx+dy*dy<rr*rr){
      applyHit(e,p,{dmg:10,kb:9,h:'mid'},{x:e.ball.x,y:e.ball.y});
      e.ballCd=520;break;
     }
    }
   }
  }else{
   e.state='idle';e.vx*=0.7;
   e.ball.x=lerp(e.ball.x,e.pts.handF.x,0.2);
   e.ball.y=lerp(e.ball.y,e.pts.handF.y+30,0.2);
   if(e.modeT<=0){
    if(d<190&&Math.random()<0.6){startMove(e,'slowKick');e.mode='';e.modeT=0;}
    else{e.mode='swing';e.modeT=rnd(2400,3800);}
   }
  }
  e.ballCd-=dt;
  break;

 /* ---- ERO: skace preko igraca i zabija peticu ---- */
 case 'acro':
  if(busy)return;
  if(!e.onGround)break;
  if(e.cd<=0){
   var r3=Math.random();
   if(d>300||r3<0.45){
    /* skok naprijed */
    e.onGround=false;e.vy=-14.2;e.vx=e.dir*(5.2+lvl*0.5);e.state='jump';A.jump();
    e.mode='air';e.cd=rnd(900,1300)-lvl*120;
    e.diveAt=rnd(160,300);
   }else if(r3<0.72){
    startMove(e,'kickHigh');e.cd=rnd(700,1000)-lvl*100;
   }else{
    startMove(e,'sweep');e.cd=rnd(750,1050)-lvl*100;
   }
  }else{
   if(d>240)walk(e.dir,1.15);
   else if(d<130)walk(-e.dir,1.0);
   else stand();
  }
  break;

 /* ---- CIRO: brz, trostruka kombinacija visoko-srednje-nisko ---- */
 case 'nun':
  if(busy)return;
  if(e.combo>0){
   var seq=['nunHigh','nunMid','nunLow'];
   startMove(e,seq[3-e.combo]);
   e.combo--;
   if(e.combo===0)e.cd=rnd(620,900)-lvl*110;
   break;
  }
  if(d>230)walk(e.dir,1.3);
  else if(d<110)walk(-e.dir,1.0);
  else{
   stand();
   if(e.cd<=0){e.combo=3;}
  }
  break;

 /* ---- MRKONJA: sve pomijesano, blok, nozevi, juris ---- */
 case 'boss':
  if(!e.phase2&&e.hp<=e.hpMax*CONFIG.BOSS_PHASE_HP){e.phase2=true;e.mode='rage';e.modeT=920;e.cd=900;e.flash=700;A.rage();S.bossRageT=1250;showMsg(t('rage'));MUS.setStage(6,true);impactBurst(e.pts.sh.x,e.pts.sh.y,1.5,'#ffb15c');}
  if(e.mode==='rage'){e.vx*=0.4;e.state='idle';e.blocking=false;if(e.modeT<=0){e.mode='';e.cd=160;}break;}
  if(busy){
   if(e.move.proj&&e.t>=e.move.st&&!e.hitDone){e.hitDone=true;spawnProj(e,e.throwH);}
   return;
  }
  if(e.mode==='block'){
   e.blocking=true;e.vx*=0.7;e.state='idle';
   if(e.modeT<=0)e.mode='';
   break;
  }
  if(!e.onGround)break;
  var rage=e.phase2?1:0, rageMul=rage?0.72:1;
  if(e.cd<=0){
   var r4=Math.random();
   if(d>420){
    if(r4<(rage?0.68:0.5)){e.throwH=['high','mid','low'][ri(0,2)];startMove(e,'toss');e.cd=(rnd(600,900)-lvl*120)*rageMul;}
    else{e.onGround=false;e.vy=rage?-14.4:-13.6;e.vx=e.dir*(rage?7.3:6.4);e.state='jump';A.jump();e.cd=rnd(700,1050)*rageMul;}
   }else if(d>200){
    if(r4<(rage?0.30:0.45)){e.vx=e.dir*(rage?10.5:9);e.cd=rage?180:260;}
    else if(r4<(rage?0.72:0.8))startMove(e,'slash'),e.cd=rnd(560,850)*rageMul;
    else startMove(e,'slashLow'),e.cd=rnd(620,920)*rageMul;
   }else{
    if(r4<(rage?0.18:0.3)){e.mode='block';e.modeT=rnd(300,520);e.cd=rage?260:420;}
    else if(r4<(rage?0.56:0.6))startMove(e,'slash'),e.cd=rnd(500,760)*rageMul;
    else if(r4<(rage?0.78:0.82))startMove(e,'kickHigh'),e.cd=rnd(560,820)*rageMul;
    else startMove(e,'slashLow'),e.cd=rnd(600,880)*rageMul;
   }
  }else{
   if(d>250)walk(e.dir,rage?1.45:1.2);
   else if(d<120)walk(-e.dir,rage?1.2:1.0);
   else stand();
  }
  break;
 }
 /* zracni udarac (Ero i boss) */
 if(!e.onGround&&e.state!=='attack'){
  if(e.vy>-3&&Math.abs(p.x-e.x)<(e.diveAt||220)){
   startMove(e,e.cfg.ai==='boss'?'diveKick':'diveKick');
  }
 }
}

function updateFight(dt){
 if(S.comboT>0){S.comboT-=dt;if(S.comboT<=0)S.combo=0;}if(S.counterT>0)S.counterT-=dt;if(S.parryT>0)S.parryT-=dt;if(S.bossRageT>0)S.bossRageT-=dt;if(S.koSlowT>0)S.koSlowT-=dt;if(S.impactT>0)S.impactT-=dt;
 if(S.hitStop>0){S.hitStop-=dt;updParts(dt);return;}
 S.timer-=dt;
 if(S.timer<=0&&player.state!=='ko'&&foe.state!=='ko'){
  S.timer=0;showMsg(t('timeup'));loseLife();return;
 }
 playerControl(dt);
 aiUpdate(foe,player,dt);
 updateFighter(player,dt);
 updateFighter(foe,dt);
 /* razdvajanje */
 var dx=foe.x-player.x;

  var push=(74-Math.abs(dx))/2*(dx>0?1:-1);

  player.x=clamp(player.x,70,W-70);foe.x=clamp(foe.x,70,W-70);
 }
 checkHits(player,foe);
 checkHits(foe,player);
 updProjs(dt);

 if(S.shake>0)S.shake-=dt*0.02;
}

 if(tm>1460){txt(t('score')+': '+S.score,W/2,492,34,'#fff0c0','center',900);} 
 if(tm>2100&&Math.floor(tm/300)%2===0)txt(t('next'),W/2,H-42,24,'#ffe6b3','center',800);
}
function drawKO(tm){
 drawFightScene(tm);
 ctx.fillStyle='rgba(60,10,6,.35)';ctx.fillRect(0,0,W,H);
 txt(t('ko'),W/2,220,64,'#ff7a5a','center',900);
}
function drawOver(tm){
 ctx.fillStyle='#120c0a';ctx.fillRect(0,0,W,H);
 drawBG(6,tm);
 ctx.fillStyle='rgba(10,7,6,.6)';ctx.fillRect(0,0,W,H);
 txt(t('over'),W/2,270,72,'#ff8a5a','center',900);
 txt(t('score')+': '+S.score,W/2,344,32,'#f0dfb8','center',700);
 txt(t('hi')+': '+S.hi,W/2,388,26,'#cbb894','center',700);
 if(tm>1200&&Math.floor(tm/460)%2===0)
  txt(t('again')+' ('+t('press')+')',W/2,470,30,'#ffe0a0','center',900);
 txt('\u00A9 by FG',W/2,H-30,20,'#a7906c','center',700);
}
function drawEnding(tm){
 drawBG(6,tm);
 ctx.fillStyle='rgba(10,7,6,.45)';ctx.fillRect(0,0,W,H);drawCinematicBars(clamp(tm/450,0,1));
 if(!endingFighter)endingFighter=mkFighter({x:W/2,dir:1,scale:1.3,style:SANER_STYLE,hp:1});
 var f=endingFighter;f.t=tm;f.state='win';f.pose=fighterPoseFlavor(f,P.win);f.pts=buildPts(f,f.pose);
 drawFighter(f);
 txt(t('endtitle'),W/2,120,40,'#ffd76a','center',900);
 speech({bks:'Sad je red na kahvu, platit će Mrkonja.',
         de:'Jetzt ist der Kaffee dran, Mrkonja zahlt.',
         en:'Now for the coffee, Mrkonja is paying.'},W/2,182,25);
 if(tm>1500)txt(t('loop')+' '+(S.loop+1),W/2,H-120,32,'#ffb46a','center',900);
 if(tm>1850)speechBubble(770,150,370,locText({bks:'Ko je sljedeći za kahvu i batine?',de:'Wer ist der Nächste für Kaffee und Prügel?',en:'Who is next for coffee and a beating?'}),'Šaner',true,'#8d2b2b');
 if(tm>2200&&Math.floor(tm/420)%2===0)txt(t('press'),W/2,H-64,24,'#e8d6ae','center',700);
}
function drawFightScene(tm){
 ctx.save();
 if(S.shake>0){ctx.translate(rnd(-S.shake,S.shake),rnd(-S.shake,S.shake));}
 drawBG(FOES[S.stage].bg,tm);
 var order=(player.y<foe.y)?[foe,player]:[player,foe];
 drawFighter(order[0]);
 drawFighter(order[1]);
 drawDroppedWeapon(player);drawDroppedWeapon(foe);
 drawProjs();
 drawParts();
 ctx.restore();
 if(S.impactT>0){ctx.save();ctx.globalAlpha=.08*(S.impactT/120);ctx.fillStyle='#fff4d2';ctx.fillRect(0,0,W,H);ctx.restore();}
 drawHUD();
 drawTouch();
 if(S.msgT>0){
  txt(S.msg,W/2,260,48,'#ffb35a','center',900);
 }
}

/* ============================================================
   HAUPTSCHLEIFE
   ============================================================ */
function step(dt){
 dt=Math.min(dt,48);
 S.sceneT+=dt;
 if(S.msgT>0)S.msgT-=dt;
 MUS.update();
 switch(S.scene){
 case 'boot':
  if(ASSETS.ready&&(S.sceneT>3200||KP.start)){S.scene='title';S.sceneT=0;KP.start=false;}
  break;
 case 'title':
  if((KP.start||K.any)&&S.sceneT>350){KP.start=false;A.init();A.coin();startGame();}
  break;
 case 'versus':
  updParts(dt);
  if(S.sceneT>4700||(KP.start&&S.sceneT>1200)){
   KP.start=false;S.scene='fight';S.sceneT=0;S.timer=60000;A.gong();
  }
  break;
 case 'travel':
  updParts(dt);
  if(S.sceneT>2400||(KP.start&&S.sceneT>900)){KP.start=false;S.scene='versus';S.sceneT=0;}
  break;
 case 'fight':
  updateFight(dt);
  break;
 case 'clear':
  if(S.koSlowT>0)S.koSlowT-=dt;
  if(S.sceneT<760){player.state='walk';player.vx=2.4;player.walkPh+=dt*.012;if(player.x<430)player.x+=2.6*dt/16.67;}
  else{player.state='win';player.vx*=0.7;}
  var cdt=S.koSlowT>0?dt*.46:dt;updateFighter(player,cdt);updateFighter(foe,cdt);updParts(cdt);
  if(S.sceneT>860&&Math.floor(S.sceneT/220)!==S.tallyStep&&S.sceneT<1700){S.tallyStep=Math.floor(S.sceneT/220);spark(player.x+30,GROUND-150,8,'#ffe08a');}
  if(S.sceneT>3200||(KP.start&&S.sceneT>1200)){
   KP.start=false;
   addScore(Math.round(player.hp)*30+Math.max(0,Math.floor(S.timer/1000))*40);
   nextStage();
  }
  break;
 case 'ko':
  if(S.koSlowT>0)S.koSlowT-=dt;
  var kdt=S.koSlowT>0?dt*.46:dt;updateFighter(player,kdt);updateFighter(foe,kdt);updParts(kdt);
  if(S.sceneT>1900){loseLife();}
  break;
 case 'retry':
  updateFighter(player,dt);updateFighter(foe,dt);updParts(dt);
  if(S.sceneT>900){retryStage();}
  break;
 case 'over':
  if(S.sceneT>1200&&(KP.start||K.any)){KP.start=false;S.scene='title';S.sceneT=0;}
  break;
 case 'ending':
  if(S.sceneT>2200&&(KP.start||K.any)){
   KP.start=false;
   spawnFoe();player.hp=player.hpMax;player.x=340;player.state='idle';
   S.scene='versus';S.sceneT=0;
  }
  break;
 }
 KP.start=false;
}
function render(){
 var tm=performance&&performance.now?performance.now():Date.now();
 ctx.clearRect(0,0,W,H);
 switch(S.scene){
 case 'boot': drawBoot(S.sceneT);break;
 case 'title':drawTitle(S.sceneT);break;
 case 'travel':drawTravel(S.sceneT);break;
 case 'versus':drawVersus(S.sceneT);break;
 case 'fight':drawFightScene(tm);break;
 case 'clear':drawClear(S.sceneT);break;
 case 'ko':drawKO(S.sceneT);break;
 case 'retry':drawFightScene(tm);break;
 case 'over':drawOver(S.sceneT);break;
 case 'ending':drawEnding(S.sceneT);break;
 }
 /* letterbox vignette */
 ctx.save();
 var vg=ctx.createRadialGradient(W/2,H/2,H*0.35,W/2,H/2,H*0.85);
 vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.42)');
 ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
 ctx.restore();
}
var last=0,acc=0,FIXED=1000/60;
function frame(ts){
 if(!last)last=ts;
 var dt=Math.min(100,ts-last);last=ts;acc+=dt;
 var n=0;while(acc>=FIXED&&n<4){step(FIXED);acc-=FIXED;n++;}
 if(n===4)acc=0;
 render();
 try{requestAnimationFrame(frame);}catch(e){}
}
try{document.addEventListener('visibilitychange',function(){last=0;acc=0;});}catch(e){}
newPlayer();spawnFoe();
try{requestAnimationFrame(frame);}catch(e){}

/* Test-Hook */
try{globalThis.__jdkf={step:step,render:render,S:S,get player(){return player;},get foe(){return foe;},K:K,KP:KP,startGame:startGame,FOES:FOES,spawnFoe:spawnFoe,nextStage:nextStage,CONFIG:CONFIG,MOVES:MOVES,setScene:setScene};}catch(e){}

})();
